# Spins up MongoDB and Redis for local development.
# Run: docker compose up -d
# Then run the server and client separately (see README).
version: '3.8'
services:
  mongo:
    image: mongo:7
    container_name: social-dashboard-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: social-dashboard-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
